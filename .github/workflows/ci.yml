name: CI

on:
  push:
    branches: [ "main", "ci" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Install `pnpm`
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
      - name: Pack
        run: pnpm pack
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: weak-ref-map.tgz
          path: 'weak-ref-map-*.tgz'
